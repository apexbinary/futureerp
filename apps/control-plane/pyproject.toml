[project]
name = "control-plane"
version = "0.1.0"
description = "FUTURE_ERP control plane — the cloud brain / source of truth."
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "erp-core",
    "erp-identity",
    "erp-tenancy",
    "erp-entitlements",
    "erp-licensing-crypto",
    "erp-observability",
    "erp-config",
]

[tool.uv.sources]
erp-core = { workspace = true }
erp-identity = { workspace = true }
erp-tenancy = { workspace = true }
erp-entitlements = { workspace = true }
erp-licensing-crypto = { workspace = true }
erp-observability = { workspace = true }
erp-config = { workspace = true }
