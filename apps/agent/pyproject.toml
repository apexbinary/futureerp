[project]
name = "agent"
version = "0.1.0"
description = "FUTURE_ERP self-hosted agent — phone-home, license sync, signed updates, telemetry."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "erp-core",
    "erp-licensing-crypto",
    "erp-observability",
    "erp-config",
]

[project.scripts]
erp-agent = "agent.main:main"

[tool.uv.sources]
erp-core = { workspace = true }
erp-licensing-crypto = { workspace = true }
erp-observability = { workspace = true }
erp-config = { workspace = true }
